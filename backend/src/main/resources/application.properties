server.port=${PORT:8080}

# Local file-based persistent H2 database by default, overridable by environment variables in production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/bankqdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (available for local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security / JWT
bankq.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
bankq.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
bankq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
